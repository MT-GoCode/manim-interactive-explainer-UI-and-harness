name: CI
on:
  push:
  pull_request:
concurrency:  # a newer push supersedes a running check of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      EXPLAINERS_NICE: "1"  # ./test otherwise re-runs itself at background priority, for a laptop in use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tinytex
          key: tinytex-${{ runner.os }}-${{ hashFiles('setup.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: ./setup.sh --no-links
      - run: ./test py,unit,e2e  # perf measures the machine it runs on; packaged registers an app with LaunchServices
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
