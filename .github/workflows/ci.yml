name: CI
on: push
concurrency:  # a newer push supersedes a running check of the same branch; every push to main is checked to the end
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30  # the first run took 9m47s with a cold cache
    env:
      PYTHONUNBUFFERED: "1"
      EXPLAINERS_NICE: "1"  # ./test otherwise re-runs itself at background priority, for a laptop in use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - uses: actions/cache@v4
        with:
          path: .tinytex
          key: tinytex-${{ runner.os }}-${{ hashFiles('setup.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/electron
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: ./setup.sh --no-links
      # e2e, perf and packaged run locally (the pre-push hook): the runner's 1024x768 screen is smaller than the
      # windows the e2e tests restore, perf measures the machine it runs on, packaged registers an app.
      - run: ./test py,unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
