[project]
name = "explainers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim==0.22.0",
    "pillow<13",  # manim 0.22 draws images with Image.fromarray(..., mode=), which Pillow 13 removed
    "numpy",
    "jsonschema",
]

[project.scripts]
explain-build = "explainers.build:main"

[dependency-groups]
dev = ["pytest", "pytest-xdist", "psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainers"]
