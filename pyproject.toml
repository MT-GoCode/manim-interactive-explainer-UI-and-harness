[project]
name = "explainers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["manim==0.22.0", "numpy", "jsonschema"]

[project.scripts]
explain-build = "explainers.build:main"

[dependency-groups]
dev = ["pytest", "pytest-xdist", "psutil"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["explainers"]
